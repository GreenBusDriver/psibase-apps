[package]
name = "mcp-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mcp = { path = "../service/", version = "0.29.0" }
psibase.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen-rt.workspace = true

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "mcp:plugin"

[package.metadata.component.target]
world = "impl"

[package.metadata.component.target.dependencies]
"host:client" = { path = "wit/deps/host-client/world.wit" }
"host:http" = { path = "wit/deps/host-http/world.wit" }
"host:types" = { path = "wit/deps/host-types/world.wit" }
"host:accounts" = { path = "wit/deps/host-accounts/world.wit" }
"auth-sig:plugin" = { path = "wit/deps/auth-sig/world.wit" }
"transact:plugin" = { path = "wit/deps/transact/world.wit" }
"staged-tx:plugin" = { path = "wit/deps/staged-tx/world.wit" }
"permissions:plugin" = { path = "wit/deps/permissions/world.wit" }
"profiles:plugin" = { path = "wit/deps/profiles/world.wit" }
"accounts:plugin" = { path = "wit/deps/accounts/world.wit" }
"tokens:plugin" = { path = "wit/deps/tokens/world.wit" }
