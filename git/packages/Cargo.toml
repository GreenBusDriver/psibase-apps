[workspace]
resolver = "2"
members = [
    "Git",
    "Git/service",
    "Git/plugin",
]

[workspace.package]
version = "0.29.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Pin to the SDK train (nix-pkg-dev nix/release.nix psibaseCrateVersion).
psibase = "=0.29.0"
psibase_macros = "=0.29.0"
psibase_service = "=0.29.0"
psibase_plugin = "=0.29.0"
async-graphql = "=7.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen-rt = { version = "0.30.0", features = ["bitflags"] }

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true
