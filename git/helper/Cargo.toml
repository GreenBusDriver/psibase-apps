[package]
name = "git-remote-psibase"
version = "0.29.0"
edition = "2021"
rust-version = "1.98"
description = "git remote helper for repositories stored by the psibase `git` service"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
flate2 = "1.0"
fracpack = "=0.29.0"
psibase = "=0.29.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8.19"
url = "2.5"

# Size-optimized build for install tarballs stored on chain as Sites files.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
